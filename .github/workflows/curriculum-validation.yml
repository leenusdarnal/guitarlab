name: Curriculum validation

on:
  push:
    paths:
      - "content/curriculum/**"
      - "scripts/validate-curriculum.mjs"
      - ".github/workflows/curriculum-validation.yml"
  pull_request:
    paths:
      - "content/curriculum/**"
      - "scripts/validate-curriculum.mjs"
      - ".github/workflows/curriculum-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Validate curriculum structure and lesson links
        run: node scripts/validate-curriculum.mjs
