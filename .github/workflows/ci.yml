name: GuitarLab CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guitarlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast code and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        shell: bash
        run: |
          timeout 120s npm audit --package-lock-only --json --fetch-timeout=30000 --fetch-retries=1 > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          if [ ! -s "$RUNNER_TEMP/npm-audit.json" ]; then
            echo "npm audit did not produce a report; check registry availability and retry."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) {
            console.error('npm audit returned an incomplete report:', JSON.stringify(report.error ?? report));
            process.exit(2);
          }
          const entries = Object.entries(report.vulnerabilities || {});
          for (const [name, item] of entries) {
            console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          const blocking = entries.filter(([, item]) => ['high', 'critical'].includes(item.severity));
          if (blocking.length) {
            console.error(`Found ${blocking.length} high/critical dependency advisories.`);
            process.exit(1);
          }
          const advisoryCount = report.metadata.vulnerabilities.moderate + report.metadata.vulnerabilities.low;
          console.log(`Dependency audit passed: no high/critical advisories; moderate/low advisories: ${advisoryCount}.`);
          NODE

      - name: Check formatting for changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "A valid base commit is required for changed-file formatting checks."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files=()
          while IFS= read -r file; do
            case "$file" in
              src/lib/*.ts|src/app.d.ts|*.js|*.json|*.ts|wrangler*.jsonc|\
              scripts/validate-design-tokens.mjs|scripts/finalize-db-migration.mjs|\
              scripts/test-local-db.mjs|scripts/browser-acceptance.mjs|\
              scripts/curriculum-browser-acceptance.mjs)
                changed_files+=("$file")
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No Prettier-managed source files changed."
          else
            npx prettier --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Type and Svelte checks
        run: npm run check

      - name: Unit tests
        run: npm run test:run

  data-validation:
    name: Database and curriculum validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and finalize Drizzle migration
        run: npm run db:generate && npm run db:finalize

      - name: Apply migrations to local-only D1
        run: npm run db:migrate:local

      - name: Test local D1 integrity constraints
        run: npm run db:test:local

      - name: Validate curriculum
        run: npm run curriculum:validate

      - name: Validate design-token contrast
        run: npm run design:validate

  build-validation:
    name: Cloudflare build and Worker smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Validate Cloudflare preview deployment configuration
        run: npx wrangler deploy --config wrangler.preview.jsonc --dry-run

      - name: Cloudflare Worker local smoke test
        shell: bash
        run: |
          ./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8787/ --output "$RUNNER_TEMP/guitarlab-home.html"; then
              break
            fi
            sleep 2
          done
          if [ ! -s "$RUNNER_TEMP/guitarlab-home.html" ]; then
            cat "$RUNNER_TEMP/wrangler-preview.log"
            echo "Cloudflare Worker did not return the home page."
            exit 1
          fi
          grep -q "GuitarLab" "$RUNNER_TEMP/guitarlab-home.html"
          echo "Cloudflare Worker smoke test passed: GET / returned GuitarLab HTML."

      - name: Preserve Cloudflare preview build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guitarlab-cloudflare-preview
          path: |
            .svelte-kit/cloudflare/
            wrangler.jsonc
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 7 || 1 }}

  browser-acceptance:
    name: Application browser acceptance
    needs: build-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Cloudflare build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: guitarlab-cloudflare-preview

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Browser acceptance tests
        run: npm run test:browser

  curriculum-browser-acceptance:
    name: Curriculum browser acceptance
    needs: build-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Cloudflare build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: guitarlab-cloudflare-preview

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Curriculum browser acceptance tests
        run: npm run test:curriculum-browser

  validate:
    name: Validate application and curriculum
    if: always()
    needs:
      - fast-checks
      - data-validation
      - build-validation
      - browser-acceptance
      - curriculum-browser-acceptance
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to pass
        env:
          FAST_CHECKS: ${{ needs.fast-checks.result }}
          DATA_VALIDATION: ${{ needs.data-validation.result }}
          BUILD_VALIDATION: ${{ needs.build-validation.result }}
          BROWSER_ACCEPTANCE: ${{ needs.browser-acceptance.result }}
          CURRICULUM_BROWSER_ACCEPTANCE: ${{ needs.curriculum-browser-acceptance.result }}
        shell: bash
        run: |
          printf 'Fast checks: %s\nDatabase and curriculum: %s\nBuild and Worker smoke test: %s\nBrowser acceptance: %s\nCurriculum browser acceptance: %s\n' \
            "$FAST_CHECKS" "$DATA_VALIDATION" "$BUILD_VALIDATION" "$BROWSER_ACCEPTANCE" "$CURRICULUM_BROWSER_ACCEPTANCE"
          for result in "$FAST_CHECKS" "$DATA_VALIDATION" "$BUILD_VALIDATION" "$BROWSER_ACCEPTANCE" "$CURRICULUM_BROWSER_ACCEPTANCE"; do
            if [ "$result" != "success" ]; then
              echo "One or more required validation jobs did not pass."
              exit 1
            fi
          done
          echo "All GuitarLab validation jobs passed."
