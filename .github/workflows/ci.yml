name: GuitarLab CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "chore/**"]

permissions:
  contents: read

concurrency:
  group: guitarlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and curriculum
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and finalize Drizzle migration
        run: npm run db:generate && npm run db:finalize

      - name: Commit generated lockfile and migrations
        if: github.event_name == 'push' && github.ref_name == 'feat/m2-d1-drizzle-data-foundation'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json drizzle/migrations
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Drizzle dependencies and seed D1 migration"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Apply migrations to local-only D1
        run: npm run db:migrate:local

      - name: Test local D1 integrity constraints
        run: npm run db:test:local

      - name: Validate curriculum
        run: npm run curriculum:validate

      - name: Validate design-token contrast
        run: npm run design:validate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type and Svelte checks
        run: npm run check

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Cloudflare Worker local smoke test
        shell: bash
        run: |
          npm run preview -- --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8787/ --output "$RUNNER_TEMP/guitarlab-home.html"; then
              break
            fi
            sleep 2
          done
          if [ ! -s "$RUNNER_TEMP/guitarlab-home.html" ]; then
            cat "$RUNNER_TEMP/wrangler-preview.log"
            echo "Cloudflare Worker did not return the home page."
            exit 1
          fi
          grep -q "GuitarLab" "$RUNNER_TEMP/guitarlab-home.html"
          echo "Cloudflare Worker smoke test passed: GET / returned GuitarLab HTML."

      - name: Preserve Cloudflare preview build
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: guitarlab-cloudflare-preview
          path: |
            .svelte-kit/cloudflare/
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Audit dependency lockfile
        shell: bash
        run: |
          timeout 45s npm audit --package-lock-only --json --fetch-timeout=20000 --fetch-retries=1 > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          if [ ! -s "$RUNNER_TEMP/npm-audit.json" ]; then
            echo "npm audit could not complete within 45 seconds; inspect registry availability and rerun."
            exit 1
          fi
          node - <<'NODE'
          const report = require(process.env.RUNNER_TEMP + '/npm-audit.json');
          const entries = Object.entries(report.vulnerabilities || {});
          for (const [name, item] of entries) {
            console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          const blocking = entries.filter(([, item]) => ['high', 'critical'].includes(item.severity));
          if (blocking.length) {
            console.error(`Found ${blocking.length} high/critical dependency advisories.`);
            process.exit(1);
          }
          NODE
