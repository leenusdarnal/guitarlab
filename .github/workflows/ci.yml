name: GuitarLab CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "chore/**"]

permissions:
  contents: read

concurrency:
  group: guitarlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and curriculum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        shell: bash
        run: |
          timeout 120s npm audit --package-lock-only --json --fetch-timeout=30000 --fetch-retries=1 > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          if [ ! -s "$RUNNER_TEMP/npm-audit.json" ]; then
            echo "npm audit did not produce a report; check registry availability and retry."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) {
            console.error('npm audit returned an incomplete report:', JSON.stringify(report.error ?? report));
            process.exit(2);
          }
          const entries = Object.entries(report.vulnerabilities || {});
          for (const [name, item] of entries) {
            console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          const blocking = entries.filter(([, item]) => ['high', 'critical'].includes(item.severity));
          if (blocking.length) {
            console.error(`Found ${blocking.length} high/critical dependency advisories.`);
            process.exit(1);
          }
          const advisoryCount = report.metadata.vulnerabilities.moderate + report.metadata.vulnerabilities.low;
          console.log(`Dependency audit passed: no high/critical advisories; moderate/low advisories: ${advisoryCount}.`);
          NODE

      - name: Install Playwright for browser acceptance
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium for browser acceptance
        run: npx playwright install chromium

      - name: Generate and finalize Drizzle migration
        run: npm run db:generate && npm run db:finalize

      - name: Apply migrations to local-only D1
        run: npm run db:migrate:local

      - name: Test local D1 integrity constraints
        run: npm run db:test:local

      - name: Validate curriculum
        run: npm run curriculum:validate

      - name: Validate design-token contrast
        run: npm run design:validate

      - name: Check formatting for changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "A valid base commit is required for changed-file formatting checks."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t changed_files < <(
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" |
              grep -E '^(src/lib/.+\.ts|src/app\.d\.ts|[^/]+\.(js|json|ts)|wrangler\.jsonc|scripts/(validate-design-tokens|finalize-db-migration|test-local-db|browser-acceptance|curriculum-browser-acceptance)\.mjs)
      - name: Lint
        run: npm run lint

      - name: Type and Svelte checks
        run: npm run check

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Cloudflare Worker local smoke test
        shell: bash
        run: |
          ./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8787/ --output "$RUNNER_TEMP/guitarlab-home.html"; then
              break
            fi
            sleep 2
          done
          if [ ! -s "$RUNNER_TEMP/guitarlab-home.html" ]; then
            cat "$RUNNER_TEMP/wrangler-preview.log"
            echo "Cloudflare Worker did not return the home page."
            exit 1
          fi
          grep -q "GuitarLab" "$RUNNER_TEMP/guitarlab-home.html"
          echo "Cloudflare Worker smoke test passed: GET / returned GuitarLab HTML."

      - name: Browser acceptance tests
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm run test:browser

      - name: Curriculum browser acceptance tests
        run: npm run test:curriculum-browser

      - name: Preserve Cloudflare preview build
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: guitarlab-cloudflare-preview
          path: |
            .svelte-kit/cloudflare/
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

 || true
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No Prettier-managed source files changed."
          else
            npx prettier --check "${changed_files[@]}"
          fi

      - name: Lint
        run: npm run lint

      - name: Type and Svelte checks
        run: npm run check

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Cloudflare Worker local smoke test
        shell: bash
        run: |
          ./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8787/ --output "$RUNNER_TEMP/guitarlab-home.html"; then
              break
            fi
            sleep 2
          done
          if [ ! -s "$RUNNER_TEMP/guitarlab-home.html" ]; then
            cat "$RUNNER_TEMP/wrangler-preview.log"
            echo "Cloudflare Worker did not return the home page."
            exit 1
          fi
          grep -q "GuitarLab" "$RUNNER_TEMP/guitarlab-home.html"
          echo "Cloudflare Worker smoke test passed: GET / returned GuitarLab HTML."

      - name: Browser acceptance tests
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm run test:browser

      - name: Curriculum browser acceptance tests
        run: npm run test:curriculum-browser

      - name: Preserve Cloudflare preview build
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: guitarlab-cloudflare-preview
          path: |
            .svelte-kit/cloudflare/
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

