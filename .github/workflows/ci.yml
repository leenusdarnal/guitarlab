name: GuitarLab CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guitarlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and curriculum
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Mark checkout safe for container Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install-dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency security audit
        shell: bash
        run: |
          timeout 120s npm audit --omit=dev --omit=optional --json --fetch-timeout=30000 --fetch-retries=1 > "$RUNNER_TEMP/npm-production-audit.json" || audit_status=$?
          if [ ! -s "$RUNNER_TEMP/npm-production-audit.json" ]; then
            echo "npm production dependency audit did not produce a report; check registry availability and retry."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-production-audit.json', 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) {
            console.error('npm production audit returned an incomplete report:', JSON.stringify(report.error ?? report));
            process.exit(2);
          }
          const entries = Object.entries(report.vulnerabilities || {});
          for (const [name, item] of entries) {
            console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          const blocking = entries.filter(([, item]) => ['high', 'critical'].includes(item.severity));
          if (blocking.length) {
            console.error(`Found ${blocking.length} high/critical production dependency advisories.`);
            process.exit(1);
          }
          const advisoryCount = report.metadata.vulnerabilities.moderate + report.metadata.vulnerabilities.low;
          console.log(`Production dependency audit passed: no high/critical advisories; moderate/low advisories: ${advisoryCount}.`);
          NODE

      - name: Report development dependency advisories
        shell: bash
        run: |
          timeout 120s npm audit --package-lock-only --json --fetch-timeout=30000 --fetch-retries=1 > "$RUNNER_TEMP/npm-full-audit.json" || audit_status=$?
          if [ ! -s "$RUNNER_TEMP/npm-full-audit.json" ]; then
            echo "Full dependency audit did not produce a report; check registry availability and retry."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-full-audit.json', 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) {
            console.error('Full dependency audit returned an incomplete report:', JSON.stringify(report.error ?? report));
            process.exit(2);
          }
          const entries = Object.entries(report.vulnerabilities || {});
          for (const [name, item] of entries) {
            console.log(`${name}: ${item.severity}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`);
          }
          const counts = report.metadata.vulnerabilities;
          const high = counts.high + counts.critical;
          if (high) {
            console.warn(`::warning::Full dependency tree has ${high} high/critical advisories. Production dependencies are gated separately; remediate development-toolchain advisories as upstream fixes become available.`);
          } else {
            console.log('Full dependency tree has no high/critical advisories.');
          }
          NODE

      - name: Verify lockfile-installed browser test dependencies
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm ls --depth=0 playwright axe-core

      # The pinned Playwright container already ships matching Chromium/WebKit
      # binaries and their OS dependencies; avoid slow, runner-specific apt installs.
      - name: Generate and finalize Drizzle migration
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        id: generate-migrations
        run: npm run db:generate && npm run db:finalize

      - name: Verify generated database migrations are committed
        if: ${{ !cancelled() && steps.generate-migrations.outcome == 'success' }}
        id: verify-migration-drift
        shell: bash
        run: |
          migration_changes="$(git status --short --untracked-files=all -- drizzle/migrations)"
          if [ -n "$migration_changes" ]; then
            echo "$migration_changes"
            echo "::error::Database migration generation changed tracked or created untracked files. Commit the generated migration SQL, snapshots and journal updates."
            git --no-pager diff -- drizzle/migrations
            exit 1
          fi
          echo "Generated database migrations match the committed repository state."

      - name: Apply migrations to local-only D1
        if: ${{ !cancelled() && steps.verify-migration-drift.outcome == 'success' }}
        id: apply-local-migrations
        run: npm run db:migrate:local

      - name: Apply and verify the isolated auth D1 migration
        id: apply-auth-migrations
        if: ${{ !cancelled() && steps.apply-local-migrations.outcome == 'success' }}
        run: npm run db:auth:migrate:local && npm run db:auth:test:local

      - name: Test local D1 integrity constraints
        if: ${{ !cancelled() && steps.apply-local-migrations.outcome == 'success' }}
        run: npm run db:test:local

      - name: Validate curriculum
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run curriculum:validate

      - name: Validate design-token contrast
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run design:validate

      - name: Check formatting
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Type and Svelte checks
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run check

      - name: Unit tests
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run test:run

      - name: Production build
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        id: production-build
        env:
          GUITARLAB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: Preserve production asset baseline
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guitarlab-production-assets-${{ github.sha }}
          path: .svelte-kit/output/client/build-asset-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate Cloudflare production deployment configuration
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
        run: npm run deploy:production:dry-run

      - name: Cloudflare Worker local smoke test
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' }}
        shell: bash
        run: |
          ./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/wrangler-local.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8787/ --output "$RUNNER_TEMP/guitarlab-home.html"; then
              break
            fi
            sleep 2
          done
          if [ ! -s "$RUNNER_TEMP/guitarlab-home.html" ]; then
            cat "$RUNNER_TEMP/wrangler-local.log"
            echo "Cloudflare Worker did not return the home page."
            exit 1
          fi
          grep -q "GuitarLab" "$RUNNER_TEMP/guitarlab-home.html"
          echo "Cloudflare Worker smoke test passed: GET / returned GuitarLab HTML."

      - name: Measure cold-cache browser route transfers
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.install-dependencies.outcome == 'success' }}
        id: route-transfer-measurement
        env:
          GUITARLAB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GUITARLAB_PERF_PORT: 8788
        run: npm run perf:routes

      - name: Preserve browser route-transfer report
        if: ${{ !cancelled() && steps.route-transfer-measurement.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guitarlab-route-transfers-${{ github.sha }}
          path: .svelte-kit/output/client/route-transfer-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Authentication lifecycle browser acceptance
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.install-dependencies.outcome == 'success' && steps.apply-auth-migrations.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:auth-browser 2>&1 | tee "$RUNNER_TEMP/auth-browser-acceptance.log"

      - name: Browser acceptance tests
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.install-dependencies.outcome == 'success' }}
        run: npm run test:browser

      - name: Music tools browser acceptance tests
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.install-dependencies.outcome == 'success' }}
        run: npm run test:music-tools-browser

      - name: Accessibility browser acceptance tests
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.install-dependencies.outcome == 'success' }}
        run: npm run test:accessibility

      - name: Curriculum browser acceptance tests
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.install-dependencies.outcome == 'success' }}
        run: npm run test:curriculum-browser

      - name: WebKit accessibility and responsive acceptance
        if: ${{ !cancelled() && steps.production-build.outcome == 'success' && steps.install-dependencies.outcome == 'success' }}
        env:
          GUITARLAB_BROWSER_ENGINE: webkit
        run: npm run test:accessibility

      # Authentication acceptance emits redacted diagnostics (the test script
      # scrubs generated emails, credentials, cookies and one-time tokens).
      # Do not upload browser traces/screenshots: those can contain local learner
      # records and authenticated session state.
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guitarlab-ci-failure-diagnostics
          path: |
            ${{ runner.temp }}/auth-browser-acceptance.log
            ${{ runner.temp }}/wrangler-local.log
          if-no-files-found: ignore
          retention-days: 3


  publish-required-status:
    name: Publish required legacy status
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report application and curriculum validation to branch protection
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$VALIDATION_RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state="$state" \
            -f context="Validate application and curriculum" \
            -f description="Application and curriculum validation: $state"

  node-26-compatibility:
    name: Check Node.js 26 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        id: install-dependencies
        run: npm ci --no-audit --no-fund

      - name: Type and Svelte checks
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run check

      - name: Unit tests
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run test:run

      - name: Production build
        if: ${{ !cancelled() && steps.install-dependencies.outcome == 'success' }}
        run: npm run build
