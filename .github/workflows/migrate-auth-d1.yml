name: Migrate GuitarLab auth D1

on:
  workflow_dispatch:
    inputs:
      confirm_migrations:
        description: Confirm applying pending auth migrations to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: guitarlab-auth-d1-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify production auth migrations
    if: github.ref == 'refs/heads/main' && inputs.confirm_migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Ensure selected commit is still main tip
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$main_sha" && test "$main_sha" = "$GITHUB_SHA" || {
            echo "Selected commit is no longer the current main tip."
            exit 1
          }

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" '
            def passed($name):
              ([.check_runs[] | select(.head_sha == $sha and .name == $name)]
               | sort_by(.started_at // .created_at // "") | last // {}) as $latest
              | $latest.status == "completed" and $latest.conclusion == "success";
            passed("Validate application and curriculum")
            and passed("Check Node.js 26 compatibility")
          ' <<< "$checks" >/dev/null || {
            echo "Required CI has not passed. No migrations were applied."
            exit 1
          }

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || {
            echo "Set the production CLOUDFLARE_ACCOUNT_ID."
            exit 1
          }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Verify active token and production D1 access
        run: |
          token_check="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          jq -e '.success == true and .result.status == "active"' <<< "$token_check" >/dev/null || {
            echo "Cloudflare token is inactive or could not be verified."
            exit 1
          }
          npx wrangler d1 execute guitarlab-auth-production --remote \
            --config wrangler.production.jsonc \
            --command "SELECT 1 AS auth_db_access_check" --json

      - name: List pending migrations before apply
        run: npx wrangler d1 migrations list guitarlab-auth-production --remote --config wrangler.production.jsonc

      - name: Apply pending authentication migrations
        run: npx wrangler d1 migrations apply guitarlab-auth-production --remote --config wrangler.production.jsonc

      - name: Verify authentication tables exist
        run: |
          npx wrangler d1 execute guitarlab-auth-production --remote --config wrangler.production.jsonc \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('user', 'session', 'account', 'verification', 'rateLimit') ORDER BY name" --json

      - name: Verify no migrations remain pending
        run: npx wrangler d1 migrations list guitarlab-auth-production --remote --config wrangler.production.jsonc
