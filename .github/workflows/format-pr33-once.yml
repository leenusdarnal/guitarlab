name: One-off PR 33 formatter
on:
  push:
    branches:
      - feat/m4-2-lesson-checkpoints-resume
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed Prettier-managed files and commit the result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '^(src/lib/.*\.ts|src/app\.d\.ts|.*\.js|.*\.json|.*\.ts|wrangler.*\.jsonc|scripts/(validate-design-tokens|finalize-db-migration|test-local-db|browser-acceptance|curriculum-browser-acceptance)\.mjs)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Prettier-managed files."
            exit 0
          fi
          npx prettier --write "${files[@]}"
          if git diff --quiet; then
            echo "The changed files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: apply repository Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
