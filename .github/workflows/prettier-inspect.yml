name: Temporary P1 formatter inspection

on:
  push:
    branches:
      - fix/p1-reliability-deploy-hardening
    paths:
      - scripts/browser-acceptance.mjs
      - .github/workflows/prettier-inspect.yml

permissions:
  contents: read

jobs:
  print-formatted-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Print exact Prettier output
        run: npx prettier scripts/browser-acceptance.mjs
