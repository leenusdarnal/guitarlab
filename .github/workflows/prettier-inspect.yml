name: Temporary Prettier source inspection

on:
  push:
    branches:
      - feat/m5-1-offline-app-shell
    paths:
      - src/service-worker.ts
      - scripts/curriculum-browser-acceptance.mjs
      - src/routes/learn/+page.server.ts
      - src/routes/learn/[lessonId]/+page.server.ts
      - .github/workflows/prettier-inspect.yml

permissions:
  contents: read

jobs:
  print-formatted-sources:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Print exact Prettier output
        shell: bash
        run: |
          for file in src/service-worker.ts scripts/curriculum-browser-acceptance.mjs src/routes/learn/+page.server.ts 'src/routes/learn/[lessonId]/+page.server.ts'; do
            echo "===== FORMAT FILE START: $file ====="
            npx prettier "$file"
            echo "===== FORMAT FILE END: $file ====="
          done
