name: Refresh auth dependency lock

on:
  push:
    branches:
      - feat/m5-secure-account-auth
    paths:
      - package.json
      - .github/workflows/auth-lock-refresh.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Preserve refreshed lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: guitarlab-auth-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
