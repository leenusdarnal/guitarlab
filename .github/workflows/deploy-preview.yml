name: Deploy GuitarLab preview

on:
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Confirm deployment to the public guitarlab-preview Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  deployments: write

concurrency:
  group: guitarlab-preview-deployment
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI for deployment commit
    if: github.ref == 'refs/heads/main' && inputs.deploy_preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Ensure the selected commit is still the main tip
        shell: bash
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$main_sha" || "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "The selected commit is no longer the current main branch tip."
            echo "Selected: $GITHUB_SHA"
            echo "Current main: $main_sha"
            echo "Run the workflow again after main is stable."
            exit 1
          fi

      - name: Require a successful CI check for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          if ! jq -e --arg sha "$GITHUB_SHA" '
            def passed($name):
              ([
                .check_runs[]
                | select(.head_sha == $sha and .name == $name)
              ]
              | sort_by(.started_at // .created_at // "")
              | last // {}) as $latest
              | $latest.status == "completed"
                and $latest.conclusion == "success";
            passed("Validate application and curriculum")
            and passed("Check Node.js 26 compatibility")
          ' <<< "$checks" >/dev/null; then
            echo "The latest baseline or Node 26 compatibility check is not successful for $GITHUB_SHA."
            echo "The preview Worker has not been changed."
            exit 1
          fi
          echo "The latest baseline and Node 26 compatibility checks passed for $GITHUB_SHA."

  deploy-preview:
    name: Build and deploy preview Worker
    needs: verify-ci
    if: github.ref == 'refs/heads/main' && inputs.deploy_preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "Set the GitHub Actions repository variable CLOUDFLARE_ACCOUNT_ID to the Cloudflare account ID."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Cloudflare Worker
        run: npm run build

      - name: Validate preview deployment configuration
        run: npx wrangler deploy --config wrangler.preview.jsonc --dry-run

      - name: Deploy preview Worker
        run: npx wrangler deploy --config wrangler.preview.jsonc

      - name: Smoke-test deployed preview
        shell: bash
        run: |
          url="https://guitarlab-preview.leenus-darnal.workers.dev/"
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail "$url" --output "$RUNNER_TEMP/guitarlab-preview.html"; then
              if grep -q "GuitarLab" "$RUNNER_TEMP/guitarlab-preview.html"; then
                echo "Preview deployment smoke test passed: $url"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Preview Worker did not return the expected GuitarLab page."
          exit 1
